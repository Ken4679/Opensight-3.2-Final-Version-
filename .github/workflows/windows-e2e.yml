name: Windows E2E & Security Corpus

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/opensight/vpn/**"
      - "scripts/**"
      - ".github/workflows/windows-e2e.yml"

permissions:
  contents: read

concurrency:
  group: windows-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-e2e:
    name: Tier 2 - Windows Platform & Security E2E
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt
          pip install --upgrade --no-deps -r requirements.lock
          pip install --no-deps -e .

      - name: Run Full Security Regression Corpus
        run: |
          pytest -v tests/security/ tests/test_path_safety.py tests/test_ovpn_security_centralized.py --junitxml=security-corpus-report.xml

      - name: Run Windows Routing, LeakGuard & Zero-Residual Uninstaller Tests
        run: |
          pytest -v tests/test_routing_features.py tests/test_uninstallation_zero_residual.py tests/test_killswitch_and_leakguard.py --junitxml=windows-e2e-report.xml

      - name: Validate PowerShell Script Syntax & AST
        shell: powershell
        run: |
          $scripts = Get-ChildItem -Path scripts/*.ps1
          foreach ($script in $scripts) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              Write-Error "Syntax error in $($script.Name): $($parseErrors | Out-String)"
              exit 1
            } else {
              Write-Host "Validated $($script.Name) syntax successfully."
            }
          }

      - name: Upload Windows E2E & Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-and-security-reports
          path: |
            security-corpus-report.xml
            windows-e2e-report.xml
          retention-days: 7

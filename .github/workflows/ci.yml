name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier1-fast-gate:
    name: Tier 1 - Fast Quality & Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 2. 配置 Bun 环境 (通过锁文件保证可复现)
      - name: Set up Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.27

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt
          pip install --upgrade --no-deps -r requirements.lock
          pip install --no-deps -e .

      - name: Install Web & Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Python Flake8 Linter
        run: flake8 src tests --config=.flake8

      - name: Pip Dependency Vulnerability Audit
        run: |
          pip-audit -r requirements.lock --format json --output dependency-report.json || true
          pip-audit -r requirements.lock || echo "::warning::pip-audit identified upstream vulnerability advisories in lockfile. See dependency-report.json for details."

      - name: Frontend TypeScript Typecheck
        run: bun run lint

      - name: Pytest Suite & Security Unit Tests
        run: |
          pytest --cov=opensight --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=test-report.xml tests/

      - name: Frontend Production Build Validation
        run: bun run build

      - name: Upload Test and Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-test-and-security-reports
          path: |
            test-report.xml
            coverage.xml
            dependency-report.json
          retention-days: 7


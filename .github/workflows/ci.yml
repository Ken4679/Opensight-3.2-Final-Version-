name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier1-fast-gate:
    name: Tier 1 - Fast Quality & Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.27

      - name: Upgrade Python Packaging Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Locked Python Dependencies
        run: |
          python -m pip install -r requirements.lock

      - name: Install Development Dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Install OpenSight
        run: |
          python -m pip install --no-deps -e .

      - name: Install Web & Frontend Dependencies
        run: |
          bun install --frozen-lockfile

      - name: Python Flake8 Linter
        run: |
          flake8 src tests --config=.flake8

      - name: Pip Dependency Vulnerability Audit
        run: |
          set +e

          echo "========================================"
          echo "Running pip-audit JSON report"
          echo "========================================"

          pip-audit \
            -r requirements.lock \
            --format json \
            --output dependency-report.json

          AUDIT_EXIT_CODE=$?

          echo ""
          echo "========================================"
          echo "PIP-AUDIT JSON REPORT"
          echo "========================================"

          if [ -f dependency-report.json ]; then
            cat dependency-report.json
          else
            echo "dependency-report.json was not created."
          fi

          echo ""
          echo "========================================"
          echo "PIP-AUDIT HUMAN-READABLE REPORT"
          echo "========================================"

          pip-audit -r requirements.lock

          HUMAN_EXIT_CODE=$?

          echo ""
          echo "========================================"
          echo "PIP-AUDIT SUMMARY"
          echo "========================================"
          echo "JSON audit exit code: $AUDIT_EXIT_CODE"
          echo "Human-readable audit exit code: $HUMAN_EXIT_CODE"
          echo "========================================"

          if [ "$AUDIT_EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "ERROR: pip-audit found known vulnerabilities."
            echo "The CI security gate will fail as intended."
            exit "$AUDIT_EXIT_CODE"
          fi

          if [ "$HUMAN_EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "ERROR: pip-audit human-readable audit failed."
            exit "$HUMAN_EXIT_CODE"
          fi

          echo ""
          echo "SUCCESS: pip-audit found no known vulnerabilities."

      - name: Frontend TypeScript Typecheck
        run: |
          bun run lint

      - name: Pytest Suite & Security Unit Tests
        run: |
          pytest \
            --cov=opensight \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-report.xml \
            tests/

      - name: Frontend Production Build Validation
        run: |
          bun run build

      - name: Upload Test and Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-test-and-security-reports
          path: |
            test-report.xml
            coverage.xml
            dependency-report.json
          retention-days: 7

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensight"
version = "3.2.0"
description = "Security-first, local-first OpenVPN node measurement and management utility."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OpenSight Contributors"}
]

dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "uvicorn[standard]==0.44.0",
    "httpx==0.28.1",
    "websockets==14.2",
    "python-dotenv==1.2.3",
    "idna==3.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "flake8>=6.0.0",
    "pip-audit>=2.7.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
opensight = "opensight.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

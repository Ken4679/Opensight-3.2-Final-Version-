[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensight"
version = "3.2.0"
description = "Security-first, local-first OpenVPN node measurement and management utility."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OpenSight Contributors"}
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "starlette>=0.38.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-core>=2.18.0,<3.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "websockets>=12.0,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "flake8>=6.0.0",
    "pip-audit>=2.7.0",
    "pyinstaller>=6.0.0",
    "h11>=0.16.0",
]

[project.scripts]
opensight = "opensight.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "scripts"]


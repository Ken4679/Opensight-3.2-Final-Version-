[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensight"
version = "3.2.0"
description = "Security-first, local-first OpenVPN node measurement and management utility."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OpenSight Contributors"}
]

dependencies = [
    "fastapi>=0.141.1,<0.142.0",
    "starlette>=1.3.1,<1.4.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-core>=2.41.5,<3.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "websockets>=14.2,<16.0",
    "python-dotenv>=1.2.3,<2.0.0",
    "idna>=3.18,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "flake8>=6.0.0",
    "pip-audit>=2.7.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
opensight = "opensight.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
